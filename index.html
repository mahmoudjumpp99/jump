<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d14">
<title>تقييم الجسم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090d14;
    --card:#111827;
    --card-border:#1f2937;
    --text:#f3f4f6;
    --muted:#8b95a7;
    --accent:#ff6a13;
    --blue:#60a5fa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    font-family:'Cairo',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:24px 20px 80px;
  }
  .wrap{max-width:1000px;margin:0 auto}

  .topbar{display:flex;justify-content:flex-end;margin-bottom:24px}
  .lang{
    font-family:inherit;font-size:13px;font-weight:700;
    color:var(--text);background:#0f1623;
    border:1px solid #243044;border-radius:999px;
    padding:8px 18px;cursor:pointer;
    transition:border-color .15s;
  }
  .lang:hover{border-color:var(--accent)}
  .lang:focus-visible,.filters button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  header h1{
    font-size:clamp(52px,10vw,92px);
    font-weight:900;
    line-height:1.05;
    letter-spacing:-1px;
  }
  header h1 span{display:block;color:var(--accent)}
  header p{margin-top:14px;color:var(--muted);font-size:14px}

  .filters{display:flex;flex-wrap:wrap;gap:10px;margin:36px 0 28px}
  .filters button{
    font-family:inherit;font-size:12px;font-weight:600;
    color:var(--text);background:#0f1623;
    border:1px solid #243044;border-radius:999px;
    padding:9px 18px;cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .filters button:hover{border-color:var(--accent)}
  .filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:12px 12px 16px;
  }
  .card video{
    display:block;width:100%;
    aspect-ratio:9/16;object-fit:cover;
    background:#000;border-radius:10px;
  }
  .card .cat{display:block;margin:14px 4px 4px;font-size:11px;font-weight:800;color:var(--accent)}
  .card h2{margin:0 4px;font-size:15px;font-weight:700}
  .card .dur{margin:6px 4px 0;font-size:11px;color:var(--muted)}
  .card[hidden]{display:none}

  @media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:520px){
    body{padding:20px 14px 60px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button type="button" class="lang" id="langBtn" aria-label="Switch language"></button>
  </div>
  <header>
    <h1 id="t1"></h1>
    <p id="sub"></p>
  </header>
  <nav class="filters" id="filters"></nav>
  <main class="grid" id="grid"></main>
</div>

<script>
  // Video files are in the videos folder next to this file.
  // cat: strength | endurance | flexibility
  const EXERCISES = [
    { ar:"ضغط نص (Half Push Ups)", en:"Half Push Ups", cat:"strength",    src:"videos/half-push-ups.mp4" },
    { ar:"ضغط (Push Ups)",         en:"Push Ups",      cat:"strength",    src:"videos/push-ups.mp4" },
    { ar:"سكوات (Squats)",         en:"Squats",        cat:"strength",    src:"videos/squats.mp4" },
    { ar:"الأرجل (Legs)",          en:"Legs",          cat:"strength",    src:"videos/legs.mp4" },
    { ar:"بطن (Sit Ups)",           en:"Sit Ups",       cat:"strength",    src:"videos/sit-ups.mp4" },
    { ar:"بلانك (Plank)",          en:"Plank",         cat:"endurance",   src:"videos/plank.mp4" },
    { ar:"هولو (Hollow Hold)",     en:"Hollow Hold",   cat:"endurance",   src:"videos/hollow.mp4" },
    { ar:"كوبري (Bridge)",         en:"Bridge",        cat:"flexibility", src:"videos/bridge.mp4" },
    { ar:"سبليت (Split)",          en:"Split",         cat:"flexibility", src:"videos/split.mp4" },
    { ar:"الكتف (Shoulder)",       en:"Shoulder",      cat:"flexibility", src:"videos/shoulder.mp4" },
    { ar:"الظهر (Back)",           en:"Back",          cat:"flexibility", src:"videos/back.mp4" }
  ];

  const I18N = {
    ar:{ dir:"rtl", title:"تقييم الجسم", h1:["تقييم","الجسم."],
         sub:"اختر القسم واضغط على أي تمرين لمشاهدة الفيديو هنا. القوة، التحمل والمرونة.",
         all:"الكل", dur:"لمدة دقيقة", btn:"English",
         cats:{strength:"القوة",endurance:"التحمل",flexibility:"المرونة"} },
    en:{ dir:"ltr", title:"Body Assessment", h1:["Body","Assessment."],
         sub:"Pick a category and press any exercise to watch the video here. Strength, endurance and flexibility.",
         all:"All", dur:"For one minute", btn:"العربية",
         cats:{strength:"Strength",endurance:"Endurance",flexibility:"Flexibility"} }
  };
  const CAT_KEYS = ["strength","endurance","flexibility"];

  const $ = id => document.getElementById(id);
  let lang = "ar", filter = "all";
  try { const s = localStorage.getItem("lang"); if (s === "en" || s === "ar") lang = s; } catch(e){}

  function render(){
    const t = I18N[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;
    document.title = t.title;
    $("t1").innerHTML = `${t.h1[0]}<span>${t.h1[1]}</span>`;
    $("sub").textContent = t.sub;
    $("langBtn").textContent = t.btn;

    const tabs = [["all", t.all, EXERCISES.length],
      ...CAT_KEYS.map(k => [k, t.cats[k], EXERCISES.filter(e => e.cat === k).length])];
    $("filters").innerHTML = tabs.map(([k,label,n]) =>
      `<button type="button" data-key="${k}" aria-pressed="${k === filter}">${label} (${n})</button>`).join("");

    // Rebuild cards only once so videos keep playing/state when switching language
    const grid = $("grid");
    if (!grid.children.length){
      grid.innerHTML = EXERCISES.map(e => `
        <article class="card" data-cat="${e.cat}">
          <video controls preload="metadata" playsinline src="${e.src}"></video>
          <span class="cat"></span><h2></h2><p class="dur"></p>
        </article>`).join("");
    }
    [...grid.children].forEach((card, i) => {
      const e = EXERCISES[i];
      card.querySelector(".cat").textContent = t.cats[e.cat];
      card.querySelector("h2").textContent = e[lang];
      card.querySelector(".dur").textContent = t.dur;
      card.hidden = filter !== "all" && e.cat !== filter;
    });
  }

  $("filters").addEventListener("click", ev => {
    const btn = ev.target.closest("button");
    if (!btn) return;
    filter = btn.dataset.key;
    render();
    $("grid").querySelectorAll(".card[hidden] video").forEach(v => v.pause());
  });

  $("langBtn").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    try { localStorage.setItem("lang", lang); } catch(e){}
    render();
  });

  render();
</script>
</body>
</html>
